name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Test & Build (Java 21 + Maven + JaCoCo)
  # ─────────────────────────────────────────────────────────────
  test-and-build:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Tests with JaCoCo
        run: mvn -B clean verify

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Archive JaCoCo Code Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build Docker Image
  # ─────────────────────────────────────────────────────────────
  docker-build:
    name: Build Container Image
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t blood-broker:latest .

  # ─────────────────────────────────────────────────────────────
  # Job 3: Push to AWS ECR (Runs on main push when secrets exist)
  # ─────────────────────────────────────────────────────────────
  push-ecr:
    name: Deploy to Amazon ECR
    needs: [test-and-build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      ECR_REGISTRY: 192905952216.dkr.ecr.eu-north-1.amazonaws.com
      ECR_REPOSITORY: blood-broker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: env.HAS_AWS_SECRETS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        env:
          HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}

      - name: Log in to Amazon ECR
        if: env.HAS_AWS_SECRETS == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        env:
          HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}

      - name: Build, tag, and push image to ECR
        if: env.HAS_AWS_SECRETS == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
          HAS_AWS_SECRETS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

